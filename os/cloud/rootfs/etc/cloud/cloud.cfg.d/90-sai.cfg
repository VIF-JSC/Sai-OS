# Sai cloud defaults (cloud-init). Anything here can be overridden by user-data.

# Probe these metadata sources in order; None = boot anyway with no metadata
# (e.g. a plain KVM/Proxmox VM without a cloud-init drive).
datasource_list: [NoCloud, ConfigDrive, OpenStack, Ec2, GCE, Azure, VMware, None]

# Default login user: saiadmin (renamed at build time by CLOUD_USER).
# Gets the SSH key AND the password the cloud panel passes to cloud-init
# (`password:` / `chpasswd:` in user-data, Proxmox cipassword, ...). No password
# is baked into the image; without one from the cloud, log in by SSH key and run
# `sudo passwd saiadmin`. The password works for SSH and remote desktop (xrdp).
system_info:
  default_user:
    name: saiadmin
    gecos: Sai Administrator
    groups: [adm, sudo, audio, video, plugdev, netdev, lpadmin]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    lock_passwd: false
  # LMDE manages networking with NetworkManager; write cloud network config for it
  network:
    renderers: [network-manager, networkd, eni]

disable_root: true
# SSH accepts the password as well as the cloud's SSH key (if one is given).
# User-data `ssh_pwauth: false` makes it key-only.
ssh_pwauth: true
ssh_deletekeys: true
ssh_genkeytypes: [ed25519, ecdsa, rsa]

# Grow the root partition and filesystem to the full VM disk on every boot
growpart:
  mode: auto
  devices: ["/"]
  ignore_growroot_disabled: false
resize_rootfs: true

# Let the cloud name the machine (falls back to "sai")
preserve_hostname: false
manage_etc_hosts: true

timezone: Asia/Ho_Chi_Minh
locale: en_US.UTF-8
